<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Twitter Clone - Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
  <div class="min-h-screen flex flex-col">
    <header class="bg-white shadow p-4 flex items-center justify-between">
      <h1 class="text-2xl font-bold text-blue-500">Twitter Clone</h1>
      <button id="logoutBtn" class="text-red-500 hover:underline">Logout</button>
    </header>

    <main class="flex-grow max-w-3xl mx-auto p-4">
      <section class="mb-6">
        <form id="tweetForm" class="flex space-x-4">
          <textarea id="tweetContent" maxlength="280" placeholder="What's happening?" class="flex-grow p-2 border rounded resize-none focus:outline-none focus:ring-2 focus:ring-blue-400"></textarea>
          <button type="submit" class="bg-blue-500 text-white px-4 rounded hover:bg-blue-600 transition">Tweet</button>
        </form>
      </section>

      <section id="timeline" class="space-y-4">
        <!-- Tweets will be appended here -->
      </section>
    </main>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const username = localStorage.getItem('username');
    if (!token) {
      window.location.href = 'index.html';
    }

    const logoutBtn = document.getElementById('logoutBtn');
    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('token');
      localStorage.removeItem('username');
      window.location.href = 'index.html';
    });

    const tweetForm = document.getElementById('tweetForm');
    const tweetContent = document.getElementById('tweetContent');
    const timeline = document.getElementById('timeline');

    tweetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const content = tweetContent.value.trim();
      if (content.length === 0) return;

      try {
        const response = await fetch('http://localhost:3000/tweets', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ content }),
        });
        if (response.ok) {
          tweetContent.value = '';
          loadTimeline();
        } else {
          alert('Failed to post tweet');
        }
      } catch (error) {
        alert('Network error');
      }
    });

    async function loadTimeline() {
      try {
        const response = await fetch('http://localhost:3000/timeline', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (response.ok) {
          const tweets = await response.json();
          timeline.innerHTML = '';
          tweets.forEach(tweet => {
            const tweetEl = document.createElement('div');
            tweetEl.className = 'bg-white p-4 rounded shadow';
            tweetEl.innerHTML = `
              <div class="font-semibold text-blue-600">@${tweet.username}</div>
              <div class="mt-1 text-gray-800">${tweet.content}</div>
              <div class="mt-2 text-xs text-gray-500">${new Date(tweet.timestamp).toLocaleString()}</div>
            `;
            timeline.appendChild(tweetEl);
          });
        } else {
          alert('Failed to load timeline');
        }
      } catch (error) {
        alert('Network error');
      }
    }

    loadTimeline();
  </script>
</body>
</html>
